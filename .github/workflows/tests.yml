name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install numpy
      - run: python tools/run_tests.py core

  blender:
    runs-on: ubuntu-24.04
    env:
      BLENDER_VERSION: "5.0.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Libraries Blender needs in background mode
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
      - name: Cache Blender
        id: cache
        uses: actions/cache@v6
        with:
          path: blender
          key: blender-${{ env.BLENDER_VERSION }}
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          MAJOR=${BLENDER_VERSION%.*}
          curl -sSL -o blender.tar.xz \
            https://download.blender.org/release/Blender${MAJOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
      - name: Background suites (Blender, samples)
        env:
          BLENDER: ${{ github.workspace }}/blender/blender
        run: python tools/run_tests.py blender sample body
